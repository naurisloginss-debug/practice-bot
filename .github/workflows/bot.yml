name: Practice bot

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 minutes
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write
  issues: write

concurrency: bot

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the bot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python bot.py

      - name: Save results
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          git config user.name "practice-bot"
          git config user.email "practice-bot@users.noreply.github.com"
          save() {
            git add data docs
            git diff --cached --quiet || git commit -q -m "Bot update $(date -u +%Y-%m-%dT%H:%MZ)"
          }
          save
          for attempt in 1 2 3 4; do
            if git pull --rebase --quiet && git push --quiet; then
              exit 0
            fi
            echo "Saving failed (attempt $attempt). Retrying."
            # If our copy collided with newer data: drop it, take the latest, and redo the run on top of it.
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              git rebase --abort
              git fetch --quiet origin main
              git reset --hard --quiet origin/main
              python bot.py
              save
            fi
            sleep $((attempt * 10))
          done
          echo "Could not save results after 4 attempts."
          exit 1

      - name: Notify
        if: hashFiles('notify.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          num=$(gh issue list --label bot --state open --json number -q '.[0].number')
          if [ -z "$num" ]; then
            gh label create bot --color 1D76DB --force
            url=$(gh issue create --title "Bot updates" --label bot --body "The bot comments here when it places a bet or a result comes in. Watch this issue to get emails.")
            num=${url##*/}
          fi
          gh issue comment "$num" --body-file notify.md
