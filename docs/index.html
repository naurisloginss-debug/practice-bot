<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<title>Edge Bot</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Edge Bot">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f2ee; --bg-glow: rgba(42,120,214,.10); --card: #ffffff; --card-2: #f7f6f2; --ink: #16161a; --ink-2: #4b4a52; --muted: #7a7882; --line: #e3e1db;
    --accent: #2a78d6; --accent-2: #eb6834;
    --good: #0b7a3b; --good-bg: #e2f4e8; --bad: #c0281c; --bad-bg: #fbe4e1; --warn: #8a5a00; --warn-bg: #fbf0d4; --neutral-bg: #edebe5;
    --bar-good: #1f9d55; --bar-bad: #d9483b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d0f12; --bg-glow: rgba(57,135,229,.18); --card: #16191e; --card-2: #1c2026; --ink: #f2f1ee; --ink-2: #c4c3be; --muted: #8d8c93; --line: #262a31;
      --accent: #3987e5; --accent-2: #d95926;
      --good: #5fd08b; --good-bg: #10301f; --bad: #ff8a7d; --bad-bg: #3a1613; --warn: #f2c25d; --warn-bg: #33280e; --neutral-bg: #20242b;
      --bar-good: #3fbf72; --bar-bad: #e5604f;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; color: var(--ink); background: var(--bg);
    background-image: radial-gradient(900px 500px at 15% -10%, var(--bg-glow), transparent 70%);
    font: 15px/1.5 "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: calc(22px + env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom)); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .num { font-variant-numeric: tabular-nums; }
  .pos { color: var(--good); } .neg { color: var(--bad); }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
  .logo { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: grid; place-items: center; color: #fff; font-size: 16px; }
  .live { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bar-good); animation: pulse 2s infinite; }
  .dot.stale { background: var(--warn); animation: none; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(31,157,85,.5); } 70% { box-shadow: 0 0 0 8px rgba(31,157,85,0); } 100% { box-shadow: 0 0 0 0 rgba(31,157,85,0); } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } * { transition: none !important; } }

  .hello { font-size: clamp(24px, 6vw, 34px); font-weight: 700; letter-spacing: -.02em; line-height: 1.15; margin: 4px 0 16px;
    background: linear-gradient(90deg, var(--ink) 30%, var(--accent) 75%, var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hello span { -webkit-text-fill-color: initial; color: initial; }
  .switch { display: inline-flex; background: var(--neutral-bg); border-radius: 12px; padding: 4px; margin-bottom: 16px; }
  .switch button { font: inherit; font-size: 14px; font-weight: 500; border: 0; background: transparent; color: var(--ink-2); padding: 7px 14px; border-radius: 9px; cursor: pointer; }
  .switch button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin-bottom: 14px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; margin: 0 0 12px; }
  .sub { color: var(--muted); font-size: 13px; }

  .hero { position: relative; overflow: hidden; }
  .hero .label { font-size: 13px; color: var(--muted); }
  .money { font-size: clamp(44px, 12vw, 68px); font-weight: 700; letter-spacing: -.03em; line-height: 1.05; margin: 2px 0 6px; }
  .change { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 16px; padding: 4px 10px; border-radius: 999px; }
  .change.up { background: var(--good-bg); color: var(--good); } .change.down { background: var(--bad-bg); color: var(--bad); } .change.flat { background: var(--neutral-bg); color: var(--ink-2); }
  .spark { position: absolute; right: 0; bottom: 0; width: 48%; height: 100%; pointer-events: none; }
  .hero-note { margin-top: 12px; font-size: 13px; color: var(--muted); max-width: 48%; position: relative; }
  @media (max-width: 560px) { .brand .sub, .live .long { display: none; } }
  .golive .head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .golive .head b { font-size: 19px; }
  .checks { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .checks li { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; font-size: 14px; }
  .tick { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .tick.ok { background: var(--good-bg); color: var(--good); } .tick.no { background: var(--neutral-bg); color: var(--muted); }
  .checks .now { color: var(--muted); font-size: 13px; }
  .ready { margin-top: 12px; padding: 10px 12px; border-radius: 12px; font-weight: 700; font-size: 14px; }
  .ready.yes { background: var(--good-bg); color: var(--good); } .ready.no { background: var(--warn-bg); color: var(--warn); }
  @media (max-width: 560px) { .spark { width: 100%; height: 55%; opacity: .35; } .hero-note { max-width: none; } }

  .verdict { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; }
  .badge { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 22px; font-weight: 700; }
  .v-good .badge { background: var(--good-bg); color: var(--good); } .v-bad .badge { background: var(--bad-bg); color: var(--bad); }
  .v-warn .badge { background: var(--warn-bg); color: var(--warn); } .v-wait .badge { background: var(--neutral-bg); color: var(--ink-2); }
  .verdict b { display: block; font-size: 19px; margin-bottom: 2px; }
  .verdict p { margin: 0; color: var(--ink-2); font-size: 14px; }
  .progress { height: 8px; background: var(--neutral-bg); border-radius: 99px; margin-top: 12px; overflow: hidden; }
  .progress i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .6s ease; }

  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .tile .k { font-size: 12px; color: var(--muted); }
  .tile .v { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin: 2px 0; }
  .tile .h { font-size: 12px; color: var(--muted); }
  @media (max-width: 560px) { .tiles { grid-template-columns: 1fr 1fr; } .tiles .tile:last-child { grid-column: span 2; } }

  .matches { display: grid; gap: 10px; }
  .match { background: var(--card-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
  .match .teams { font-weight: 500; }
  .match .meta { font-size: 12px; color: var(--muted); }
  .pick { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; margin-top: 2px; }
  .pick .odds { font-size: 12px; font-weight: 700; background: var(--ink); color: var(--card); padding: 1px 7px; border-radius: 6px; }
  .side { text-align: right; }
  .side .big { font-size: 18px; font-weight: 700; }
  .chip { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; display: inline-block; }
  .c-won { background: var(--good-bg); color: var(--good); } .c-lost { background: var(--bad-bg); color: var(--bad); }
  .c-open, .c-void { background: var(--neutral-bg); color: var(--ink-2); }
  .more { font: inherit; font-size: 13px; color: var(--accent); background: none; border: 0; cursor: pointer; padding: 8px 0 0; }

  .seg2 { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .seg2 button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: transparent; color: var(--ink-2); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .seg2 button[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .board { display: grid; gap: 8px; }
  .row, .axis { display: grid; grid-template-columns: minmax(100px, 1.2fr) 2fr 112px; gap: 10px; align-items: center; }
  .row { font-size: 14px; }
  .row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .name small { display: block; color: var(--muted); font-size: 11px; }
  .bar { position: relative; height: 12px; background: var(--neutral-bg); border-radius: 6px; }
  .bar::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); opacity: .5; }
  .bar i { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
  .bar i.g { left: 50%; background: var(--bar-good); } .bar i.r { right: 50%; background: var(--bar-bad); }
  .row .val { text-align: right; font-weight: 700; display: flex; justify-content: flex-end; align-items: center; gap: 6px; }
  .axis { font-size: 11px; color: var(--muted); }
  .axis span:nth-child(2) { display: flex; justify-content: space-between; }
  @media (max-width: 560px) { .row, .axis { grid-template-columns: 1fr 1.2fr 96px; gap: 8px; } .row .val .chip { display: none; } .row .val { font-size: 13px; } }

  .legend { display: flex; gap: 14px; font-size: 13px; color: var(--ink-2); margin-bottom: 6px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend svg { width: 18px; height: 6px; }
  .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .chartwrap { position: relative; }
  .chartwrap > svg { display: block; width: 100%; height: auto; overflow: visible; }
  .axis-t text { fill: var(--muted); font-size: 11px; }
  .grid line { stroke: var(--line); }
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--card); font-size: 12px; padding: 6px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -110%); display: none; }

  details.help summary { cursor: pointer; font-weight: 500; }
  details.help dl { margin: 10px 0 0; display: grid; gap: 10px; }
  details.help dt { font-weight: 700; } details.help dd { margin: 0; color: var(--ink-2); font-size: 14px; }
  .log div { padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-2); white-space: pre-wrap; }
  .empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
  footer { font-size: 12px; color: var(--muted); text-align: center; margin-top: 18px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="brand"><span class="logo" aria-hidden="true">⚡</span>Edge Bot <span class="sub" style="font-weight:400">· practice</span></div>
    <div class="live"><span class="dot" id="dot"></span><span id="updated">Loading…</span></div>
  </div>
  <h1 class="hello">Hi Nauris, we will become betting masterminds <span aria-hidden="true">😄</span></h1>
  <div class="switch" role="group" aria-label="Which strategy" id="switch"></div>
  <div id="app"><div class="card empty">Loading…</div></div>
</main>

<script>
const NAMES = { all: 'Any bookmaker', betfair: 'Betfair only' };
const ABOUT = {
  all: 'Takes the best price at any bookmaker. Shows how much value is out there.',
  betfair: 'Only Betfair, after its 5% fee. This is what a real automatic bot could do.'
};
const COLORS = { all: 'var(--accent-2)', betfair: 'var(--accent)' };
const NEED = 30; // bets with a final price before we judge
let data = null, backtest = null;
const ls = { get(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
let current = ls.get('strategy', 'all'), board = ls.get('board', 'by_league'), past = ls.get('past', 'by_league'), showAll = false;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => Number(n).toFixed(2);
const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '±') + money(Math.abs(n));
const pct = (n, d = 1) => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n * 100).toFixed(d) + '%';
const day = t => new Date(t).toLocaleString(undefined, { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
function rel(t) {
  const m = Math.round((new Date(t) - Date.now()) / 60000), a = Math.abs(m);
  const s = a < 1 ? 'now' : a < 60 ? a + ' min' : a < 2880 ? Math.round(a / 60) + ' h' : Math.round(a / 1440) + ' days';
  return s === 'now' ? 'just now' : m >= 0 ? 'in ' + s : s + ' ago';
}

async function load() {
  try {
    const r = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
    data = await r.json();
    try { const b = await fetch('backtest.json?t=' + Date.now(), { cache: 'no-store' }); if (b.ok) backtest = await b.json(); } catch (e) {}
    render();
  } catch (e) {
    document.getElementById('app').innerHTML = '<div class="card empty">No data yet. The bot fills this in after its first run.</div>';
  }
}

function verdict(s) {
  const n = s.clv_count;
  if (n < 10) return { cls: 'v-wait', icon: '⏳', title: 'Warming up',
    text: `Too early to judge. The bot needs about ${NEED} finished bets to tell skill from luck. ${n} so far.` };
  const beat = Math.round(s.beat_close * 100);
  if (s.avg_clv > 0.005 && s.beat_close >= 0.55) return { cls: 'v-good', icon: '✓', title: 'Looks like a real edge',
    text: `It got a better price than the market's final price on ${beat}% of bets. That is the sign pros look for, even in a losing week.` };
  if (s.avg_clv < 0 || s.beat_close < 0.45) return { cls: 'v-bad', icon: '✕', title: 'No edge so far',
    text: `It beat the market's final price on only ${beat}% of bets. Do not use real money with these settings.` };
  return { cls: 'v-warn', icon: '…', title: 'Not clear yet',
    text: `It beat the market's final price on ${beat}% of bets. Needs more bets before we decide.` };
}

function render() {
  if (!data.strategies[current]) current = Object.keys(data.strategies)[0];
  const s = data.strategies[current];
  const mins = (Date.now() - new Date(data.updated)) / 60000;
  document.getElementById('dot').className = 'dot' + (mins > 150 ? ' stale' : '');
  document.getElementById('updated').innerHTML = (mins > 150 ? 'Last run ' : '<span class="long">Live · </span>updated ') + rel(data.updated);
  document.getElementById('switch').innerHTML = ['all', 'betfair'].filter(k => data.strategies[k]).map(k =>
    `<button type="button" data-s="${k}" aria-pressed="${k === current}"><span class="sw" style="background:${COLORS[k]};margin-right:6px"></span>${NAMES[k]}</button>`).join('');

  const change = s.fund - data.start_fund, v = verdict(s);
  const mine = data.bets.filter(b => b.strategy === current);
  const open = mine.filter(b => b.status === 'open').sort((a, b) => a.start.localeCompare(b.start));
  const done = mine.filter(b => b.status !== 'open').sort((a, b) => (b.settled_at || '').localeCompare(a.settled_at || ''));
  const winRate = s.won + s.lost ? Math.round(s.won / (s.won + s.lost) * 100) : null;

  document.getElementById('app').innerHTML = `
  <section class="card hero" aria-label="Practice fund">
    ${spark(s)}
    <div class="label">Pretend money · started with ${money(data.start_fund)}</div>
    <div class="money num">${money(s.fund)}</div>
    <span class="change num ${change > 0.004 ? 'up' : change < -0.004 ? 'down' : 'flat'}">${change > 0.004 ? '▲' : change < -0.004 ? '▼' : '•'} ${signed(change)} · ${pct(change / data.start_fund)}</span>
    <div class="hero-note">${ABOUT[current]}</div>
  </section>

  <section class="card verdict ${v.cls}" aria-label="Is it working">
    <div class="badge" aria-hidden="true">${v.icon}</div>
    <div><span class="sub">Is it working?</span><b>${v.title}</b><p>${v.text}</p>
      <div class="progress" role="progressbar" aria-label="Bets measured" aria-valuemin="0" aria-valuemax="${NEED}" aria-valuenow="${Math.min(s.clv_count, NEED)}"><i style="width:${Math.min(100, s.clv_count / NEED * 100)}%"></i></div>
      <div class="sub" style="margin-top:6px">${Math.min(s.clv_count, NEED)} of ${NEED} bets measured</div></div>
  </section>

  ${goLive(s, mine)}

  <div class="tiles">
    <div class="tile"><div class="k">Bets placed</div><div class="v num">${s.bets}</div><div class="h">${s.open} waiting for the game</div></div>
    <div class="tile"><div class="k">Won</div><div class="v num">${winRate == null ? '–' : winRate + '%'}</div><div class="h">${s.won} won · ${s.lost} lost</div></div>
    <div class="tile"><div class="k">Beat the market</div><div class="v num ${s.avg_clv > 0 ? 'pos' : s.avg_clv < 0 ? 'neg' : ''}">${s.beat_close == null ? '–' : Math.round(s.beat_close * 100) + '%'}</div><div class="h">${s.avg_clv == null ? 'of bets got a better price than the final one' : `average ${pct(s.avg_clv)} better price`}</div></div>
  </div>

  <section class="card"><h2>Next up</h2>
    ${open.length ? `<div class="matches">${open.slice(0, showAll ? 50 : 4).map(matchCard).join('')}</div>${open.length > 4 ? `<button type="button" class="more" data-more>${showAll ? 'Show fewer' : 'Show all ' + open.length}</button>` : ''}`
      : '<div class="empty">No bets waiting. The bot looks for new ones every morning.</div>'}
  </section>

  <section class="card"><h2>Latest results</h2>
    ${done.length ? `<div class="matches">${done.slice(0, 6).map(matchCard).join('')}</div>` : '<div class="empty">No finished games yet.</div>'}
  </section>

  <section class="card"><h2>Where the value is</h2>
    ${seg('board', board, [['by_league', 'League'], ['by_sport', 'Sport'], ['by_market', 'Bet type']])}
    ${leaderboard(s[board], true)}
  </section>

  ${pastCard()}

  <section class="card"><h2>Pretend money over time</h2>${chart()}</section>

  <section class="card"><details class="help"><summary>What do these words mean?</summary><dl>
    <dt>Value bet</dt><dd>A price higher than the fair price. Like buying something below what it is worth.</dd>
    <dt>Fair price</dt><dd>Taken from Pinnacle, the bookmaker with the sharpest prices, with its built-in margin removed.</dd>
    <dt>Beat the market</dt><dd>The price we got was better than the final price just before kick-off. Doing this again and again is the best early sign of a real edge, long before the money shows it.</dd>
    <dt>Pretend money</dt><dd>No real bets are placed. The bot practises until the numbers say it is worth it.</dd>
  </dl></details></section>

  <section class="card"><details class="help"><summary>Bot diary</summary><div class="log">${
    (data.log || []).slice().reverse().map(l => `<div><span class="sub">${day(l.t)}</span>\n${esc(l.text.replace(/\*\*/g, ''))}</div>`).join('') || '<div>Nothing yet.</div>'}</div></details></section>

  <footer>Odds credits left: ${data.credits_left ?? '–'} · refreshes by itself every 5 minutes</footer>`;
  wireChart();
}

// The test week ends with a clear yes/no. All four must be true before real money.
const WEEK = 7 * 86400000;
function goLive(s, mine) {
  if (!mine.length) return '';
  const start = Math.min(...mine.map(b => +new Date(b.placed_at)));
  const end = start + WEEK, daysLeft = Math.ceil((end - Date.now()) / 86400000);
  const checks = [
    [Date.now() >= end, 'Test week finished', daysLeft > 0 ? `${daysLeft} day${daysLeft === 1 ? '' : 's'} left` : 'done'],
    [s.clv_count >= NEED, `At least ${NEED} bets measured`, `${s.clv_count} so far`],
    [s.beat_close != null && s.beat_close >= 0.55, 'Beats the market on 55%+ of bets', s.beat_close == null ? '–' : Math.round(s.beat_close * 100) + '%'],
    [s.avg_clv != null && s.avg_clv >= 0.01, 'Average price 1%+ better than the market', s.avg_clv == null ? '–' : pct(s.avg_clv)]
  ];
  const ok = checks.every(c => c[0]), weekDone = checks[0][0];
  const msg = ok ? 'Ready for real money, with small stakes.'
    : weekDone ? 'Not ready. Keep practising: real money would be a guess, not an edge.'
    : 'Still testing. All four need a tick before real money.';
  return `<section class="card golive" aria-label="Go-live check"><div class="head"><b>Go-live check</b>
      <span class="sub">Test week: ${new Date(start).toLocaleDateString(undefined, { day: 'numeric', month: 'short' })} → ${new Date(end).toLocaleDateString(undefined, { day: 'numeric', month: 'short' })}</span></div>
    <ul class="checks">${checks.map(([pass, label, now]) => `<li><span class="tick ${pass ? 'ok' : 'no'}" aria-label="${pass ? 'done' : 'not yet'}">${pass ? '✓' : '·'}</span><span>${label}</span><span class="now num">${now}</span></li>`).join('')}</ul>
    <div class="ready ${ok ? 'yes' : 'no'}">${msg}</div></section>`;
}

function matchCard(b) {
  const open = b.status === 'open';
  const side = open
    ? `<div class="big num">${money(b.stake)}</div><div class="meta">stake</div>`
    : `<span class="chip c-${b.status}">${b.status === 'won' ? '✓ Won' : b.status === 'lost' ? '✕ Lost' : 'Void'}</span><div class="big num ${b.profit > 0 ? 'pos' : b.profit < 0 ? 'neg' : ''}">${signed(b.profit)}</div>`;
  const clv = b.clv == null ? '' : ` · ${b.clv > 0 ? 'beat' : 'missed'} the market by ${Math.abs(b.clv * 100).toFixed(1)}%`;
  return `<div class="match"><div>
      <div class="teams">${esc(b.home)} <span class="sub">vs</span> ${esc(b.away)}</div>
      <div class="pick">${esc(b.pick)} <span class="odds num">${Number(b.odds).toFixed(2)}</span></div>
      <div class="meta">${esc(b.league)} · ${open ? day(b.start) + ' · ' + rel(b.start) : (b.score ? esc(b.score) : day(b.start))}</div>
      <div class="meta">${esc(b.book)} · ${pct(b.edge)} edge${clv}</div>
    </div><div class="side">${side}</div></div>`;
}

function seg(name, active, list) {
  return `<div class="seg2" role="group">${list.map(([k, l]) => `<button type="button" data-${name}="${k}" aria-pressed="${k === active}">${l}</button>`).join('')}</div>`;
}

function chipFor(v) {
  return { promising: '<span class="chip c-won">good</span>', 'no edge': '<span class="chip c-lost">none</span>',
    unclear: '<span class="chip c-open">unclear</span>' }[v] || '<span class="chip c-void">few</span>';
}
function liveVerdict(r) {
  if (r.clv_count < 15) return 'too few bets';
  if (r.avg_clv > 0.01 && r.beat_close >= 0.55) return 'promising';
  if (r.avg_clv < 0 || r.beat_close < 0.45) return 'no edge';
  return 'unclear';
}
// Diverging bars: how much better (green, right) or worse (red, left) than the market's final price.
function leaderboard(rows, live) {
  rows = (rows || []).filter(r => r.avg_clv != null);
  if (!rows.length) return '<div class="empty">Fills in once games have started and the final prices are in.</div>';
  const max = Math.max(0.03, ...rows.map(r => Math.abs(r.avg_clv)));
  return `<div class="board">${rows.map(r => {
    const w = Math.abs(r.avg_clv) / max * 50;
    return `<div class="row"><div class="name" title="${esc(r.name)}">${esc(r.name)}<small>${r.bets} bets</small></div>
      <div class="bar" role="img" aria-label="${esc(r.name)}: ${pct(r.avg_clv)} versus the final price"><i class="${r.avg_clv >= 0 ? 'g' : 'r'}" style="width:${w}%"></i></div>
      <div class="val num ${r.avg_clv > 0 ? 'pos' : 'neg'}">${pct(r.avg_clv)}${chipFor(live ? liveVerdict(r) : r.verdict)}</div></div>`;
  }).join('')}
  <div class="axis"><span></span><span><span>◀ worse than market</span><span>better ▶</span></span><span></span></div></div>`;
}

function pastCard() {
  if (!backtest || !backtest.strategies[current]) return '';
  const s = backtest.strategies[current], t = s.total;
  const good = (s.by_league || []).filter(r => r.verdict === 'promising').map(r => r.name);
  return `<section class="card"><h2>What history says</h2>
    <p style="margin:0 0 12px">We replayed the same rules on <b>${backtest.matches.toLocaleString()} real football matches</b> from past seasons.
      ${good.length ? `Best leagues: <b>${esc(good.slice(0, 4).join(', '))}</b>.` : 'No league stood out clearly.'}
      Overall the bets beat the market's final price by <b class="${t.avg_clv > 0 ? 'pos' : 'neg'}">${t.avg_clv == null ? '–' : pct(t.avg_clv)}</b> on average.</p>
    ${seg('past', past, [['by_league', 'League'], ['by_market', 'Bet type'], ['by_season', 'Season']])}
    ${leaderboard(s[past], false)}</section>`;
}

function spark(s) {
  const pts = s.history || [];
  if (pts.length < 2) return '';
  const vals = pts.map(p => p.fund), lo = Math.min(...vals, data.start_fund), hi = Math.max(...vals, data.start_fund), W = 300, H = 100;
  const x = i => i / (pts.length - 1) * W, y = v => H - 8 - (v - lo) / ((hi - lo) || 1) * (H - 24);
  let d = `M0,${y(vals[0])}`; vals.forEach((v, i) => { if (i) d += ` H${x(i)} V${y(v)}`; });
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${COLORS[current]}" stop-opacity=".28"/><stop offset="1" stop-color="${COLORS[current]}" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} V${H} H0 Z" fill="url(#sg)"/><path d="${d}" fill="none" stroke="${COLORS[current]}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

let chartState = null;
function chart() {
  const W = Math.round(Math.min(800, Math.max(330, document.querySelector('main').clientWidth - 38))), H = W < 500 ? 210 : 250, L = 40, R = W < 500 ? 96 : 116, T = 12, B = 28;
  const series = ['all', 'betfair'].filter(k => data.strategies[k]).map(k => ({ k, name: NAMES[k], pts: data.strategies[k].history.map(p => ({ t: +new Date(p.t), v: p.fund })) })).filter(s => s.pts.length);
  const all = series.flatMap(s => s.pts);
  const legend = `<div class="legend">${series.map(s => `<span><span class="sw" style="background:${COLORS[s.k]}"></span>${s.name}</span>`).join('')}<span><svg aria-hidden="true"><line x1="0" y1="3" x2="18" y2="3" stroke="var(--muted)" stroke-dasharray="3 3"/></svg>Start</span></div>`;
  if (all.length < 3) return legend + '<div class="empty">The line grows as results come in.</div>';
  let t0 = Math.min(...all.map(p => p.t)), t1 = Math.max(Date.now(), ...all.map(p => p.t));
  if (t1 - t0 < 86400000) t0 = t1 - 86400000;
  let lo = Math.min(data.start_fund, ...all.map(p => p.v)), hi = Math.max(data.start_fund, ...all.map(p => p.v));
  const pad = Math.max(3, (hi - lo) * .15); lo -= pad; hi += pad;
  const x = t => L + (t - t0) / (t1 - t0) * (W - L - R), y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pretend money over time"><g class="grid axis-t">`;
  for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4; svg += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${Math.round(v)}</text>`; }
  const nx = W < 500 ? 2 : 3;
  for (let i = 0; i <= nx; i++) { const t = t0 + (t1 - t0) * i / nx; svg += `<text x="${x(t)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === nx ? 'end' : 'middle'}">${new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short' })}</text>`; }
  svg += `</g><line x1="${L}" x2="${W - R}" y1="${y(data.start_fund)}" y2="${y(data.start_fund)}" stroke="var(--muted)" stroke-dasharray="4 4"/>`;
  for (const s of series) {
    const pts = s.pts.concat([{ t: t1, v: s.pts[s.pts.length - 1].v }]);
    let d = `M${x(pts[0].t)},${y(pts[0].v)}`; for (let i = 1; i < pts.length; i++) d += ` H${x(pts[i].t)} V${y(pts[i].v)}`;
    const on = s.k === current, last = pts[pts.length - 1];
    svg += `<path d="${d}" fill="none" stroke="${COLORS[s.k]}" stroke-width="${on ? 2.5 : 1.5}" stroke-opacity="${on ? 1 : .5}" stroke-linejoin="round"/>
      <circle cx="${x(last.t)}" cy="${y(last.v)}" r="4" fill="${COLORS[s.k]}" stroke="var(--card)" stroke-width="2"/>
      <text x="${x(last.t) + 8}" y="${y(last.v) + 4}" font-size="12" fill="var(--ink-2)">${s.name.split(' ')[0]} ${money(last.v)}</text>`;
  }
  svg += `<line id="xh" y1="${T}" y2="${H - B}" stroke="var(--muted)" style="display:none"/><rect id="hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/></svg>`;
  chartState = { series, t0, t1, W, L, R };
  const table = `<div class="sr"><table><caption>Pretend money after each result</caption>${series.flatMap(s => s.pts.map(p => `<tr><td>${s.name}</td><td>${day(p.t)}</td><td>${money(p.v)}</td></tr>`)).join('')}</table></div>`;
  return legend + `<div class="chartwrap">${svg}<div class="tip" id="tip"></div></div>` + table;
}
function wireChart() {
  const hit = document.getElementById('hit'); if (!hit || !chartState) return;
  const svg = hit.ownerSVGElement, tip = document.getElementById('tip'), xh = document.getElementById('xh'), { series, t0, t1, W, L, R } = chartState;
  const at = (pts, t) => { let v = pts[0].v; for (const p of pts) if (p.t <= t) v = p.v; return v; };
  hit.addEventListener('pointermove', e => {
    const box = svg.getBoundingClientRect(), px = (e.clientX - box.left) / box.width * W, t = t0 + (px - L) / (W - L - R) * (t1 - t0);
    if (t < t0 || t > t1) return;
    xh.setAttribute('x1', px); xh.setAttribute('x2', px); xh.style.display = '';
    tip.innerHTML = `<b>${new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short' })}</b><br>` + series.map(s => `<span class="sw" style="background:${COLORS[s.k]}"></span> ${s.name}: ${money(at(s.pts, t))}`).join('<br>');
    tip.style.display = 'block'; tip.style.left = (px / W * box.width) + 'px'; tip.style.top = '20px';
  });
  hit.addEventListener('pointerleave', () => { tip.style.display = 'none'; xh.style.display = 'none'; });
}

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.s) { current = t.dataset.s; ls.set('strategy', current); }
  else if (t.dataset.board) { board = t.dataset.board; ls.set('board', board); }
  else if (t.dataset.past) { past = t.dataset.past; ls.set('past', past); }
  else if ('more' in t.dataset) { showAll = !showAll; }
  else return;
  render();
});

load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
